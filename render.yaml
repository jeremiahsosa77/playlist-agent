services:
  - type: web
    name: playlist-agent-api
    runtime: docker
    plan: free
    region: ohio

    healthCheckPath: /api/health

    autoDeployTrigger: checksPass

    envVars:
      - key: APP_NAME
        value: Playlist Agent API

      - key: APP_VERSION
        value: 0.2.0

      - key: APP_ENVIRONMENT
        value: production

      - key: API_PREFIX
        value: /api

      - key: LLM_PROVIDER
        value: openrouter

      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free

      - key: LLM_TEMPERATURE
        value: "0.7"

      - key: INTERVIEW_PROMPT_VERSION
        value: playlist-interview-v1

      - key: INTERVIEW_TEMPERATURE
        value: "0.3"

      - key: INTERVIEW_MAX_QUESTIONS
        value: "6"

      - key: INTERVIEW_MAX_ATTEMPTS
        value: "4"

      - key: INTERVIEW_RETRY_BASE_SECONDS
        value: "1.5"

      - key: INTERVIEW_CONNECT_TIMEOUT_SECONDS
        value: "10"

      - key: INTERVIEW_READ_TIMEOUT_SECONDS
        value: "60"

      - key: SPOTIFY_MATCH_THRESHOLD
        value: "0.95"

      - key: SPOTIFY_CONFIDENCE_THRESHOLD
        value: "0.70"

      - key: SPOTIFY_PUBLISHING_ENABLED
        value: "false"

      - key: CORS_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000

      - key: OPENROUTER_API_KEY
        sync: false

      - key: SPOTIFY_CLIENT_ID
        sync: false

      - key: SPOTIFY_CLIENT_SECRET
        sync: false

      - key: SPOTIFY_REFRESH_TOKEN
        sync: false

      - key: BRAINTRUST_API_KEY
        sync: false